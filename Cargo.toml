[package]
name = "fintop"
version = "0.2.0"
edition = "2021"
description = "A real-time top-like terminal dashboard for stocks, market indices, currencies, and futures"
readme = "README.md"
repository = "https://github.com/sebastianmichaelsturm/fintop"
license = "MIT"
keywords = ["tui", "finance", "stocks", "indices", "ratatui"]
categories = ["command-line-utilities"]

[[bin]]
name = "fintop"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
chrono = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
